<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Clicker - Offline Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at 50% 30%, #1e130c, #0a0604);
      color: #f5eedc;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      background: rgba(15, 10, 6, 0.85);
      border-b: 1px solid rgba(217, 119, 6, 0.2);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stats-bar {
      display: flex;
      gap: 20px;
      font-size: 14px;
    }
    .stats-bar span { color: #f59e0b; font-weight: bold; }
    .main-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      height: calc(100vh - 58px);
    }
    @media (max-width: 768px) {
      .main-layout { grid-template-columns: 1fr; height: auto; }
    }
    .cookie-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      position: relative;
    }
    .cookie-counter {
      font-size: 38px;
      font-weight: 800;
      color: #fbbf24;
      text-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
      margin-bottom: 6px;
      text-align: center;
    }
    .cps-counter {
      font-size: 15px;
      color: #a8a29e;
      margin-bottom: 30px;
    }
    .big-cookie-btn {
      background: none;
      border: none;
      cursor: pointer;
      outline: none;
      transition: transform 0.08s ease;
      position: relative;
    }
    .big-cookie-btn:active {
      transform: scale(0.93);
    }
    .big-cookie {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #d97706, #92400e 70%, #78350f);
      box-shadow: 0 12px 36px rgba(0,0,0,0.6), inset 0 -8px 20px rgba(0,0,0,0.4), 0 0 40px rgba(245, 158, 11, 0.25);
      position: relative;
      cursor: pointer;
    }
    /* Choc chips */
    .chip {
      position: absolute;
      background: #451a03;
      border-radius: 50%;
      box-shadow: inset 1px 1px 3px rgba(0,0,0,0.8);
    }
    .c1 { width: 32px; height: 28px; top: 40px; left: 55px; transform: rotate(12deg); }
    .c2 { width: 36px; height: 32px; top: 110px; left: 40px; }
    .c3 { width: 28px; height: 26px; top: 60px; right: 55px; }
    .c4 { width: 34px; height: 30px; top: 130px; right: 60px; }
    .c5 { width: 38px; height: 34px; bottom: 45px; left: 100px; }
    .c6 { width: 26px; height: 24px; top: 95px; left: 110px; }

    .floating-text {
      position: absolute;
      color: #fef08a;
      font-weight: 700;
      font-size: 20px;
      pointer-events: none;
      animation: floatUp 0.8s forwards ease-out;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-70px); }
    }

    .shop-section {
      background: rgba(18, 12, 8, 0.92);
      border-left: 1px solid rgba(217, 119, 6, 0.25);
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .shop-header {
      font-size: 18px;
      font-weight: 700;
      color: #fde68a;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
    }
    .item-card {
      background: rgba(35, 23, 16, 0.7);
      border: 1px solid rgba(180, 83, 9, 0.3);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .item-card:hover {
      background: rgba(55, 36, 25, 0.9);
      border-color: #d97706;
      transform: translateY(-1px);
    }
    .item-card.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: rgba(255,255,255,0.05);
    }
    .item-info h4 { font-size: 15px; color: #f5eedc; margin-bottom: 2px; }
    .item-info p { font-size: 12px; color: #a8a29e; }
    .item-cost { font-size: 13px; color: #fbbf24; font-weight: 600; }
    .item-count {
      font-size: 20px;
      font-weight: 800;
      color: #d97706;
      padding-left: 12px;
    }
    .btn-reset {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-reset:hover { background: rgba(239, 68, 68, 0.3); }
  </style>
</head>
<body>
  <header>
    <div style="font-weight:800; color:#fbbf24; font-size:16px;">🍪 Cookie Clicker Offline</div>
    <div class="stats-bar">
      <div>Total Baked: <span id="total-baked">0</span></div>
      <div>Clicks: <span id="total-clicks">0</span></div>
    </div>
    <button class="btn-reset" onclick="resetGame()">Reset Save</button>
  </header>

  <div class="main-layout">
    <div class="cookie-section">
      <div class="cookie-counter" id="cookie-count">0 cookies</div>
      <div class="cps-counter" id="cps-display">per second: 0.0</div>

      <button class="big-cookie-btn" id="cookie-button" onclick="clickCookie(event)">
        <div class="big-cookie">
          <div class="chip c1"></div>
          <div class="chip c2"></div>
          <div class="chip c3"></div>
          <div class="chip c4"></div>
          <div class="chip c5"></div>
          <div class="chip c6"></div>
        </div>
      </button>
    </div>

    <div class="shop-section">
      <div class="shop-header">
        <span>Bakery Upgrades</span>
        <span style="font-size:12px; color:#a8a29e;">Click to buy</span>
      </div>
      <div id="shop-items"></div>
    </div>
  </div>

  <script>
    let cookies = 0;
    let totalBaked = 0;
    let totalClicks = 0;
    let clickPower = 1;

    const buildings = [
      { id: 'cursor', name: 'Auto-Cursor', cost: 15, cps: 0.2, count: 0, desc: 'Autoclicks every 5 seconds.' },
      { id: 'grandma', name: 'Cookie Grandma', cost: 100, cps: 1.0, count: 0, desc: 'A nice grandma to bake more cookies.' },
      { id: 'farm', name: 'Cookie Farm', cost: 1100, cps: 8.0, count: 0, desc: 'Grows cookie plants from cookie seeds.' },
      { id: 'mine', name: 'Chocolate Mine', cost: 12000, cps: 47.0, count: 0, desc: 'Mines pure chocolate dough and chips.' },
      { id: 'factory', name: 'Cookie Factory', cost: 130000, cps: 260.0, count: 0, desc: 'Mass produces fresh cookies by the boatload.' },
      { id: 'bank', name: 'Cookie Bank', cost: 1400000, cps: 1400.0, count: 0, desc: 'Generates cookies from interest on cookies.' },
      { id: 'portal', name: 'Cookie Portal', cost: 20000000, cps: 7800.0, count: 0, desc: 'Opens a doorway to the Cookieverse.' }
    ];

    // Load save
    try {
      const saved = localStorage.getItem('ubg_cookie_save');
      if (saved) {
        const data = JSON.parse(saved);
        cookies = data.cookies || 0;
        totalBaked = data.totalBaked || cookies;
        totalClicks = data.totalClicks || 0;
        if (data.buildings) {
          data.buildings.forEach(b => {
            const match = buildings.find(x => x.id === b.id);
            if (match) {
              match.count = b.count;
              match.cost = b.cost;
            }
          });
        }
      }
    } catch(e) {}

    // Web audio sound
    let audioCtx = null;
    function playBeep(freq, type, duration) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function calculateCps() {
      return buildings.reduce((acc, b) => acc + (b.cps * b.count), 0);
    }

    function formatNumber(num) {
      if (num >= 1e9) return (num / 1e9).toFixed(2) + ' billion';
      if (num >= 1e6) return (num / 1e6).toFixed(2) + ' million';
      if (num >= 1e3) return (num / 1e3).toFixed(1) + 'k';
      return Math.floor(num).toLocaleString();
    }

    function clickCookie(e) {
      cookies += clickPower;
      totalBaked += clickPower;
      totalClicks += 1;
      playBeep(440 + Math.random() * 80, 'sine', 0.1);

      // Spawn floating indicator
      const floatEl = document.createElement('div');
      floatEl.className = 'floating-text';
      floatEl.textContent = '+' + clickPower;
      floatEl.style.left = (e.clientX || (window.innerWidth / 3)) + 'px';
      floatEl.style.top = (e.clientY || (window.innerHeight / 2)) + 'px';
      document.body.appendChild(floatEl);
      setTimeout(() => floatEl.remove(), 800);

      updateDisplay();
    }

    function buyBuilding(id) {
      const item = buildings.find(b => b.id === id);
      if (!item || cookies < item.cost) return;

      cookies -= item.cost;
      item.count++;
      item.cost = Math.ceil(item.cost * 1.15);
      playBeep(600, 'triangle', 0.15);
      renderShop();
      updateDisplay();
      saveGame();
    }

    function renderShop() {
      const container = document.getElementById('shop-items');
      container.innerHTML = '';
      buildings.forEach(item => {
        const canAfford = cookies >= item.cost;
        const div = document.createElement('div');
        div.className = 'item-card ' + (canAfford ? '' : 'disabled');
        div.onclick = () => buyBuilding(item.id);
        div.innerHTML = `
          <div class="item-info">
            <h4>${item.name}</h4>
            <p>${item.desc} (+${item.cps} cps)</p>
            <div class="item-cost">💰 ${formatNumber(item.cost)} cookies</div>
          </div>
          <div class="item-count">${item.count}</div>
        `;
        container.appendChild(div);
      });
    }

    function updateDisplay() {
      document.getElementById('cookie-count').textContent = formatNumber(cookies) + ' cookies';
      const cps = calculateCps();
      document.getElementById('cps-display').textContent = 'per second: ' + (cps < 10 ? cps.toFixed(1) : formatNumber(cps));
      document.getElementById('total-baked').textContent = formatNumber(totalBaked);
      document.getElementById('total-clicks').textContent = totalClicks.toLocaleString();

      // Update card disabled states without full rerender
      const cards = document.querySelectorAll('.item-card');
      buildings.forEach((item, idx) => {
        if (cards[idx]) {
          if (cookies >= item.cost) {
            cards[idx].classList.remove('disabled');
          } else {
            cards[idx].classList.add('disabled');
          }
        }
      });
    }

    function saveGame() {
      try {
        localStorage.setItem('ubg_cookie_save', JSON.stringify({
          cookies, totalBaked, totalClicks, buildings
        }));
      } catch(e) {}
    }

    function resetGame() {
      if (confirm('Reset your bakery save?')) {
        cookies = 0;
        totalBaked = 0;
        totalClicks = 0;
        buildings.forEach(b => {
          b.count = 0;
          if (b.id === 'cursor') b.cost = 15;
          if (b.id === 'grandma') b.cost = 100;
          if (b.id === 'farm') b.cost = 1100;
          if (b.id === 'mine') b.cost = 12000;
          if (b.id === 'factory') b.cost = 130000;
          if (b.id === 'bank') b.cost = 1400000;
          if (b.id === 'portal') b.cost = 20000000;
        });
        localStorage.removeItem('ubg_cookie_save');
        renderShop();
        updateDisplay();
      }
    }

    // Game loop
    let lastTime = performance.now();
    setInterval(() => {
      const now = performance.now();
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      const cps = calculateCps();
      if (cps > 0) {
        const gain = cps * dt;
        cookies += gain;
        totalBaked += gain;
        updateDisplay();
      }
    }, 100);

    // Auto-save every 5s
    setInterval(saveGame, 5000);

    renderShop();
    updateDisplay();
  </script>
</body>
</html>
