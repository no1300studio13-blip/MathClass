<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Snake Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #09090b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fafafa;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }
    .top-panel {
      display: flex;
      justify-content: space-between;
      width: 480px;
      margin-bottom: 12px;
      font-size: 15px;
    }
    .val { color: #10b981; font-weight: 700; }
    canvas {
      background: #111827;
      border: 2px solid #10b981;
      border-radius: 8px;
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.2);
    }
    .controls {
      margin-top: 12px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="top-panel">
    <div>SCORE: <span class="val" id="score">0</span></div>
    <div>HIGH: <span class="val" id="high">0</span></div>
  </div>
  <canvas id="c" width="480" height="480"></canvas>
  <div class="controls">Use <b>Arrow Keys</b> or <b>WASD</b> to steer. Press <b>SPACE</b> to restart.</div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
    let velocity = { x: 1, y: 0 };
    let nextVelocity = { x: 1, y: 0 };
    let food = { x: 18, y: 12 };
    let score = 0;
    let high = parseInt(localStorage.getItem('ubg_snake_high') || '0', 10);
    document.getElementById('high').textContent = high;
    let gameOver = false;
    let speed = 90;

    function spawnFood() {
      while (true) {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        if (!snake.some(s => s.x === food.x && s.y === food.y)) break;
      }
    }

    function reset() {
      snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
      velocity = { x: 1, y: 0 };
      nextVelocity = { x: 1, y: 0 };
      score = 0;
      gameOver = false;
      document.getElementById('score').textContent = '0';
      spawnFood();
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        if (velocity.y === 0) nextVelocity = { x: 0, y: -1 };
        e.preventDefault();
      } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        if (velocity.y === 0) nextVelocity = { x: 0, y: 1 };
        e.preventDefault();
      } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        if (velocity.x === 0) nextVelocity = { x: -1, y: 0 };
        e.preventDefault();
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        if (velocity.x === 0) nextVelocity = { x: 1, y: 0 };
        e.preventDefault();
      } else if (e.code === 'Space' && gameOver) {
        reset();
      }
    });

    function update() {
      if (gameOver) return;
      velocity = nextVelocity;
      const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver = true;
        return;
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver = true;
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        if (score > high) {
          high = score;
          document.getElementById('high').textContent = high;
          localStorage.setItem('ubg_snake_high', high);
        }
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid dots
      ctx.fillStyle = '#1e293b';
      for (let x = 0; x < canvas.width; x += gridSize) {
        for (let y = 0; y < canvas.height; y += gridSize) {
          ctx.fillRect(x + gridSize / 2 - 1, y + gridSize / 2 - 1, 2, 2);
        }
      }

      // Food
      ctx.fillStyle = '#f43f5e';
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake
      snake.forEach((s, idx) => {
        ctx.fillStyle = idx === 0 ? '#34d399' : '#059669';
        ctx.shadowColor = '#10b981';
        ctx.shadowBlur = idx === 0 ? 8 : 0;
        ctx.fillRect(s.x * gridSize + 1, s.y * gridSize + 1, gridSize - 2, gridSize - 2);
      });
      ctx.shadowBlur = 0;

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = '800 32px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('CRASHED!', canvas.width / 2, 220);
        ctx.fillStyle = '#f5f5f5';
        ctx.font = '600 18px sans-serif';
        ctx.fillText('Press SPACE to Play Again', canvas.width / 2, 260);
      }
    }

    function gameLoop() {
      update();
      draw();
      setTimeout(gameLoop, speed);
    }
    spawnFood();
    gameLoop();
  </script>
</body>
</html>
